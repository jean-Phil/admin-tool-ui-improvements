<!doctype html>
<!-- rung one: a static page — no JS, no config file [S-045 (2), (3)].
     The site-detail page title bar: one space-between flex section, shipped
     twice — a light bar and a dark bar. The DARK take is not a second markup:
     a scoped override (.bar-dark) re-points the --color-* custom properties
     inside that section only, so every utility (bg-surface-raised,
     text-title, inset-ring-line, …) re-themes itself; success green and the
     near-white on-button text are left untouched — they already carry on
     dark. Left item: the page title with the small headerless table beneath
     (three rows: app1, app2, category — quiet mono cells, divide-line
     rhythm). Right item: the action stack — Refresh, the big green call;
     Update app2 token, the much smaller neutral utility (the sibling
     workspaces' Update-App-Token vocabulary, shrunk).
     derived from (corpus/tailwindplus/):
    tailwindcss-application-ui-v4/html/application-shells/stacked/03-with-lighter-page-header.html — the lighter page-header band — the title bar's anatomy: a Container-guttered band carrying the page title, actions to the right
    tailwindcss-application-ui-v4/html/lists/tables/12-with-condensed-content.html — the condensed table (the operator's twice-cited block) — the small headerless table's divide-y row rhythm and quiet cell roles
    index/primitives-named.md — Title, PrimaryButton, TableCell, RowFlex — the named primitives the bar composes
-->
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>site-detail-page-title-bar</title>
		<link rel="stylesheet" href="./theme.css" />
	</head>
	<body class="bg-surface font-sans text-body antialiased">
		<main class="mx-auto max-w-3xl px-4 py-12 sm:px-6 lg:px-8">
			<!-- the light bar -->
			<p class="text-xs font-semibold tracking-widest text-muted uppercase">Light</p>
			<section aria-label="Site detail title bar, light" class="mt-2 flex flex-wrap items-start justify-between gap-x-6 gap-y-4 rounded-lg bg-surface-raised px-4 py-5 inset-ring-1 inset-ring-line sm:px-6">
				<div>
					<h1 class="font-semibold text-title text-2xl">Harborview East</h1>
					<table class="mt-2">
						<tbody class="divide-y divide-line">
							<tr>
								<td class="py-1.5 pr-10 font-mono text-sm whitespace-nowrap text-muted">app1</td>
							</tr>
							<tr>
								<td class="py-1.5 pr-10 font-mono text-sm whitespace-nowrap text-muted">app2</td>
							</tr>
							<tr>
								<td class="py-1.5 pr-10 font-mono text-sm whitespace-nowrap text-muted">category</td>
							</tr>
						</tbody>
					</table>
				</div>
				<div class="flex flex-col items-end gap-2">
					<button type="button" class="rounded-md bg-success px-4 py-2 text-base font-semibold text-accent-contrast shadow-xs hover:bg-success-hover focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-success">
						Refresh
					</button>
					<button type="button" class="rounded-md bg-surface px-2 py-1 text-xs font-semibold text-title inset-ring-1 inset-ring-line hover:bg-surface-raised focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-accent">
						Update app2 token
					</button>
				</div>
			</section>

			<!-- the dark bar: identical markup, the .bar-dark scope re-points the tokens -->
			<p class="mt-12 text-xs font-semibold tracking-widest text-muted uppercase">Dark</p>
			<section aria-label="Site detail title bar, dark" class="bar-dark mt-2 flex flex-wrap items-start justify-between gap-x-6 gap-y-4 rounded-lg bg-surface-raised px-4 py-5 inset-ring-1 inset-ring-line sm:px-6">
				<div>
					<h1 class="font-semibold text-title text-2xl">Harborview East</h1>
					<table class="mt-2">
						<tbody class="divide-y divide-line">
							<tr>
								<td class="py-1.5 pr-10 font-mono text-sm whitespace-nowrap text-muted">app1</td>
							</tr>
							<tr>
								<td class="py-1.5 pr-10 font-mono text-sm whitespace-nowrap text-muted">app2</td>
							</tr>
							<tr>
								<td class="py-1.5 pr-10 font-mono text-sm whitespace-nowrap text-muted">category</td>
							</tr>
						</tbody>
					</table>
				</div>
				<div class="flex flex-col items-end gap-2">
					<button type="button" class="rounded-md bg-success px-4 py-2 text-base font-semibold text-accent-contrast shadow-xs hover:bg-success-hover focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-success">
						Refresh
					</button>
					<button type="button" class="rounded-md bg-surface px-2 py-1 text-xs font-semibold text-title inset-ring-1 inset-ring-line hover:bg-surface-raised focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-accent">
						Update app2 token
					</button>
				</div>
			</section>
		</main>
	</body>
</html>

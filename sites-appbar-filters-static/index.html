<!doctype html>
<!-- rung one: a static page — no JS, no config file [S-045 (2), (3)].
     The static take of the hydrated sibling (workspaces/sites-appbar-
     filters): the same app bar and filters, every state as static markup.
     The app bar carries the title with the result-set count and the utility
     Update App Token button apart; the filter well is one form with a
     native GET submit — Billing Category (medium select), Required Action
     (large select), Site Ids (multiline), Tenant Id (single line), Sort By
     (medium select) with the ASC | DESC segmented pair static (ASC
     selected), Apply filters native. The Billing Batch typeahead is shown
     mid-filter — a query typed, the listbox open and filtered to three
     batches, one active — the combobox anatomy as the corpus itself ships
     it (01-simple is static open-state markup). House tokens via theme.css.
     derived from (corpus/tailwindplus/):
    tailwindcss-application-ui-v4/html/forms/comboboxes/01-simple.html — the typeahead combobox anatomy as a STATIC open state — the block itself ships an open, filtered listbox
    tailwindcss-application-ui-v4/html/forms/select-menus/01-simple-native.html — the native selects (Billing Category, Required Action, the Sort By field)
    tailwindcss-application-ui-v4/html/forms/textareas/01-simple.html — the multiline Site Ids field
    tailwindcss-application-ui-v4/html/forms/radio-groups/02-simple-inline-list.html — the A-or-B direction choice (source state for the ASC/DESC pair)
    tailwindcss-application-ui-v4/html/elements/button-groups/01-basic.html — the joined segmented control — ASC | DESC as a compact pair, the sibling console's joined-group vocabulary
    index/primitives-named.md — Container, Title, FieldLabel, TextInput, PrimaryButton, MenuItem, text roles
-->
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>sites-appbar-filters-static</title>
		<link rel="stylesheet" href="./theme.css" />
	</head>
	<body class="bg-surface font-sans text-body antialiased">
		<main class="mx-auto max-w-7xl px-4 py-12 sm:px-6 lg:px-8">
			<!-- the app bar: title with the result-set count, the utility button apart -->
			<div class="flex flex-wrap items-baseline justify-between gap-x-4 gap-y-2">
				<div class="flex items-baseline gap-x-3">
					<h1 class="font-semibold text-title text-2xl">Sites</h1>
					<p class="text-sm tabular-nums text-muted">142 sites in the result set</p>
				</div>
				<button type="button" class="rounded-md bg-surface-raised px-3 py-2 text-sm font-semibold text-title inset-ring-1 inset-ring-line hover:bg-surface focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-accent">
					Update App Token
				</button>
			</div>

			<!-- the filter bar: one well, one form, GET submit — Apply filters is native.
			     Shown mid-filter: the Billing Batch typeahead open, a query typed. -->
			<form action="#" class="mt-6 rounded-lg bg-surface-raised inset-ring-1 inset-ring-line">
				<div class="px-4 py-5 sm:p-6">
					<div class="grid grid-cols-1 gap-x-4 gap-y-5 sm:grid-cols-6">
						<div class="sm:col-span-2">
							<label for="billing-category" class="block font-medium text-title text-sm">Billing Category</label>
							<div class="relative mt-2">
								<select id="billing-category" name="billing-category" class="block w-full appearance-none rounded-md bg-surface px-3 py-1.5 pr-9 text-base text-title outline-1 -outline-offset-1 outline-line focus:outline-2 focus:-outline-offset-2 focus:outline-accent sm:text-sm/6">
									<option value="" selected>All categories</option>
									<option value="hardware">Hardware</option>
									<option value="cloud">Cloud services</option>
									<option value="services">Professional services</option>
								</select>
								<svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="pointer-events-none absolute top-2.5 right-3 size-5 text-muted">
									<path d="M5.23 7.21a.75.75 0 0 1 1.06.02L10 11.168l3.71-3.938a.75.75 0 1 1 1.08 1.04l-4.25 4.5a.75.75 0 0 1-1.08 0l-4.25-4.5a.75.75 0 0 1 .02-1.06Z" clip-rule="evenodd" fill-rule="evenodd" />
								</svg>
							</div>
						</div>
						<div class="sm:col-span-4">
							<label for="required-action" class="block font-medium text-title text-sm">Required Action</label>
							<div class="relative mt-2">
								<select id="required-action" name="required-action" class="block w-full appearance-none rounded-md bg-surface px-3 py-1.5 pr-9 text-base text-title outline-1 -outline-offset-1 outline-line focus:outline-2 focus:-outline-offset-2 focus:outline-accent sm:text-sm/6">
									<option value="" selected>No action required</option>
									<option value="renewal">Renewal due</option>
									<option value="payment">Payment failed</option>
									<option value="review">Compliance review</option>
								</select>
								<svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="pointer-events-none absolute top-2.5 right-3 size-5 text-muted">
									<path d="M5.23 7.21a.75.75 0 0 1 1.06.02L10 11.168l3.71-3.938a.75.75 0 1 1 1.08 1.04l-4.25 4.5a.75.75 0 0 1-1.08 0l-4.25-4.5a.75.75 0 0 1 .02-1.06Z" clip-rule="evenodd" fill-rule="evenodd" />
								</svg>
							</div>
						</div>
						<div class="sm:col-span-2">
							<label for="site-ids" class="block font-medium text-title text-sm">Site Ids</label>
							<textarea id="site-ids" name="site-ids" rows="3" placeholder="One site id per line" class="mt-2 block w-full rounded-md bg-surface px-3 py-2 text-base text-title outline-1 -outline-offset-1 outline-line placeholder:text-muted focus:outline-2 focus:-outline-offset-2 focus:outline-accent sm:text-sm/6"></textarea>
						</div>
						<div class="sm:col-span-2">
							<label for="tenant-id" class="block font-medium text-title text-sm">Tenant Id</label>
							<input type="text" id="tenant-id" name="tenant-id" placeholder="tnt-0000-0000" class="mt-2 block w-full rounded-md bg-surface px-3 py-1.5 text-base text-title outline-1 -outline-offset-1 outline-line placeholder:text-muted focus:outline-2 focus:-outline-offset-2 focus:outline-accent sm:text-sm/6" />
						</div>
						<div class="sm:col-span-2">
							<label for="billing-batch" class="block font-medium text-title text-sm">Billing Batch</label>
							<div class="relative mt-2">
								<input type="text" id="billing-batch" name="billing-batch" autocomplete="off" value="Batch 2026-06" role="combobox" aria-expanded="true" aria-controls="billing-batch-listbox" aria-autocomplete="list" class="block w-full rounded-md bg-surface px-3 py-1.5 pr-9 text-base text-title outline-1 -outline-offset-1 outline-line placeholder:text-muted focus:outline-2 focus:-outline-offset-2 focus:outline-accent sm:text-sm/6" />
								<button type="button" tabindex="-1" aria-label="Toggle the billing batch list" class="absolute inset-y-0 right-0 flex items-center rounded-r-md px-2 text-muted hover:text-title focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-accent">
									<svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="size-5">
										<path d="M5.23 7.21a.75.75 0 0 1 1.06.02L10 11.168l3.71-3.938a.75.75 0 1 1 1.08 1.04l-4.25 4.5a.75.75 0 0 1-1.08 0l-4.25-4.5a.75.75 0 0 1 .02-1.06Z" clip-rule="evenodd" fill-rule="evenodd" />
									</svg>
								</button>
								<!-- the open listbox: the query filtered eight batches to three, the first active -->
								<ul id="billing-batch-listbox" role="listbox" aria-label="Billing batches" class="absolute z-10 mt-2 max-h-60 w-full overflow-auto rounded-md bg-surface-raised py-1 shadow-lg outline-1 -outline-offset-1 outline-line">
									<li><button type="button" role="option" aria-selected="false" class="block w-full truncate bg-accent px-3 py-2 text-left text-sm select-none text-accent-contrast">Batch 2026-06 · Card</button></li>
									<li><button type="button" role="option" aria-selected="false" class="block w-full truncate px-3 py-2 text-left text-sm select-none text-title">Batch 2026-06 · Invoice</button></li>
									<li><button type="button" role="option" aria-selected="false" class="block w-full truncate px-3 py-2 text-left text-sm select-none text-title">Batch 2026-06 · Direct debit</button></li>
								</ul>
							</div>
						</div>
					</div>

					<!-- Sort By: one label, the medium dropdown, and the static direction pair -->
					<div class="mt-5 flex flex-wrap items-end gap-x-4 gap-y-3">
						<div>
							<label for="sort-by" class="block font-medium text-title text-sm">Sort By</label>
							<div class="relative mt-2">
								<select id="sort-by" name="sort-by" class="block w-56 appearance-none rounded-md bg-surface px-3 py-1.5 pr-9 text-base text-title outline-1 -outline-offset-1 outline-line focus:outline-2 focus:-outline-offset-2 focus:outline-accent sm:text-sm/6">
									<option value="last-updated" selected>Last updated</option>
									<option value="name">Name</option>
									<option value="next-billing">Next billing date</option>
									<option value="site-count">Site count</option>
								</select>
								<svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="pointer-events-none absolute top-2.5 right-3 size-5 text-muted">
									<path d="M5.23 7.21a.75.75 0 0 1 1.06.02L10 11.168l3.71-3.938a.75.75 0 1 1 1.08 1.04l-4.25 4.5a.75.75 0 0 1-1.08 0l-4.25-4.5a.75.75 0 0 1 .02-1.06Z" clip-rule="evenodd" fill-rule="evenodd" />
								</svg>
							</div>
						</div>
						<div class="pb-0.5">
							<span class="isolate inline-flex rounded-md shadow-xs" role="group" aria-label="Sort direction">
								<button type="button" aria-pressed="true" class="relative inline-flex items-center rounded-l-md bg-accent px-3 py-2 text-sm font-semibold text-accent-contrast shadow-xs hover:bg-accent-hover focus:z-10 focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-accent">ASC</button>
								<button type="button" aria-pressed="false" class="relative -ml-px inline-flex items-center rounded-r-md bg-surface-raised px-3 py-2 text-sm font-semibold text-title inset-ring-1 inset-ring-line hover:bg-surface focus:z-10 focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-accent">DESC</button>
							</span>
						</div>
					</div>

					<!-- Apply filters: the form's native GET submit -->
					<div class="mt-6">
						<button type="submit" class="inline-flex items-center rounded-md bg-accent px-3 py-2 text-sm font-semibold text-accent-contrast shadow-xs hover:bg-accent-hover focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-accent">
							Apply filters
						</button>
					</div>
				</div>
			</form>

			<!-- the shown state, captioned (the payload-console precedent for static states) -->
			<p class="mt-3 text-sm text-muted">Shown mid-filter: the Billing Batch typeahead is open — a query typed, eight batches filtered to three, the first active.</p>
		</main>
	</body>
</html>

schema: styleguide.manifest/1
name: sites-appbar-filters-static
request: "Sites app bar and filters, rung one — the static take of the hydrated sibling: the page title 'Sites' with the result-set count beside it; the filters — Billing Category (medium dropdown), Required Action (large dropdown), Site Ids (multiline textfield), Tenant Id (single-line textfield), Billing Batch (medium dropdown typeahead, presented as a static open state — a query typed, the list filtered, one option active); a 'Sort By' label with a medium dropdown and an ASC/DESC segmented pair (static, ASC selected); an 'Apply filters' submit button; a separate unrelated utility 'Update App Token' button. No JS — every state is static markup."
date: 2026-11-18
rung: static-page
derivedFrom:
  - path: tailwindcss-application-ui-v4/html/forms/comboboxes/01-simple.html
    note: the typeahead combobox anatomy as a STATIC open state — the block itself ships an open, filtered listbox
  - path: tailwindcss-application-ui-v4/html/forms/select-menus/01-simple-native.html
    note: the native selects (Billing Category, Required Action, the Sort By field)
  - path: tailwindcss-application-ui-v4/html/forms/textareas/01-simple.html
    note: the multiline Site Ids field
  - path: tailwindcss-application-ui-v4/html/forms/radio-groups/02-simple-inline-list.html
    note: the A-or-B direction choice (source state for the ASC/DESC pair)
  - path: tailwindcss-application-ui-v4/html/elements/button-groups/01-basic.html
    note: the joined segmented control — ASC | DESC as a compact pair, the sibling console's joined-group vocabulary
  - path: index/primitives-named.md
    note: Container, Title, FieldLabel, TextInput, PrimaryButton, MenuItem, text roles
